# render.yaml — one-click deployment on Render.com
# Push to GitHub, connect the repo on render.com, done.
# Make sure models/vit_cifar10_torch.pth is committed (see README).

services:
  - type: web
    name: vit-cifar10
    runtime: python
    buildCommand: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements-serve.txt
    startCommand: gunicorn app.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /health
